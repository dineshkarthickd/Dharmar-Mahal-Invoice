<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="premiumShadow" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceGraphic" dx="1" dy="1" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="0.5" />
      <feBlend in="SourceGraphic" in2="blurOut" mode="normal" />
    </filter>
  </defs>
  <rect width="32" height="32" fill="#1a2b43" rx="4" ry="4"/>
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="url(#goldGradient)" stroke-width="0.7" rx="2" ry="2" opacity="0.3"/>
  <text x="50%" y="68%" text-anchor="middle" font-family="Playfair Display, Times New Roman, serif" font-weight="900" font-size="20" fill="url(#goldGradient)" filter="url(#premiumShadow)">DM</text>
</svg>
